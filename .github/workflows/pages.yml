# GitHub Pages: in the repository settings, set Pages > Source to "GitHub Actions". Every push to main redeploys.
# A GitHub Pages site may not be larger than 1 GB, so this edition leaves out the Selenite library (3.1 GB).
# DarkNux + GN-Math come to about 350 MB. Netlify and Vercel can host everything.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the site
        run: node tools/build.mjs --libs html,gn-math
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
